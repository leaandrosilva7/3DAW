<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lótus Studio — Entrar</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap {
    max-width: 420px;
    margin: 60px auto 100px;
    padding: 0 24px;
  }

  .auth-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 40px 36px;
  }

  .auth-card h1 {
    color: var(--primary);
    font-size: 1.6rem;
    margin-bottom: 6px;
  }

  .auth-sub {
    color: var(--text-soft);
    font-size: .9rem;
    margin-bottom: 28px;
  }

  .form-field { margin-bottom: 18px; }

  .form-field label {
    display: block;
    font-weight: 600;
    font-size: .85rem;
    margin-bottom: 6px;
    color: var(--text);
  }

  .form-field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-family: inherit;
    font-size: .95rem;
    box-sizing: border-box;
  }

  .form-field input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .auth-error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: .85rem;
    font-weight: 600;
    margin-bottom: 18px;
    display: none;
  }

  .btn-block { width: 100%; justify-content: center; margin-top: 4px; }

  .auth-footer-link {
    text-align: center;
    margin-top: 22px;
    font-size: .9rem;
    color: var(--text-soft);
  }

  .auth-footer-link a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="top-bar"></div>

<header class="site-header">
  <a href="index.html" class="logo">
    <span class="logo-text">Lótus Studio</span>
    <img src="img/logo.png" alt="Lótus Studio">
  </a>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="index.html#servicos">Serviços</a>
    <a href="index.html#sobre">Sobre nós</a>
    <a href="index.html#unidades">Unidades</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Bem-vindo de volta</h1>
    <p class="auth-sub">Entre com sua conta para agendar seu próximo atendimento.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-solid btn-block" id="login-btn">Entrar</button>
    </form>

    <div class="auth-footer-link">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-logo-wrap">
    <img src="img/logo.png" alt="Lótus Studio">
  </div>
  <div>Lótus Studio · Spa e Salão de Beleza · Todas as unidades — Rio de Janeiro</div>
</footer>

<script>
function showError(msg) {
  var el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  document.getElementById('auth-error').style.display = 'none';

  var btn = document.getElementById('login-btn');
  var originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  var payload = {
    action: 'login',
    email:  document.getElementById('email').value.trim(),
    senha:  document.getElementById('senha').value
  };

  fetch('api/auth.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      window.location.href = 'dashboard.html';
    } else {
      showError(data.mensagem || 'Nao foi possivel entrar.');
      btn.disabled = false;
      btn.textContent = originalText;
    }
  })
  .catch(function() {
    showError('Erro de conexao. Tente novamente.');
    btn.disabled = false;
    btn.textContent = originalText;
  });
});
</script>

</body>
</html>
